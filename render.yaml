# Render blueprint. Import this repository at https://dashboard.render.com/blueprints
# and Render creates the service below. Secrets are never stored here: the API
# key is marked `sync: false`, so Render prompts for it once and keeps it out of
# the repository.
services:
  - type: web
    name: vada
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VADA_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: VADA_LLM_MODEL
        value: gemini-3.1-flash-lite
