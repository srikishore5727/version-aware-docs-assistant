name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Hermetic, offline, deterministic: no key, no network, no model call.
  VADA_EMBEDDINGS: hash
  GEMINI_API_KEY: ""

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Score the golden set
        run: python -m app.evaluate --min-recall 0.85

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-report
          path: data/eval/report.json
          if-no-files-found: ignore
